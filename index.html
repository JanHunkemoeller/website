<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Hunkemöller — Im Aufbau</title>
    
    <!-- Sorts Mill Goudy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Authentisches Bleimennige-Rot / Minium */
            --mennige: #C84323;
        }

        /* Text-Selektion (Rubrizierung beim Markieren) */
        ::selection {
            background-color: transparent;
            color: var(--mennige);
        }

        ::-moz-selection {
            background-color: transparent;
            color: var(--mennige);
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Sorts Mill Goudy', serif;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            -webkit-font-smoothing: antialiased;
            
            display: table;
            width: 100vw;
            height: 100vh;
            text-align: center;
        }

        .container {
            display: table-cell;
            vertical-align: middle;
            padding: 24px;
        }

        h1 {
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 22.15px;
        }

        p {
            font-size: 18px;
            line-height: 22.15px;
            margin-bottom: 0;
        }

        p.status {
            font-style: italic;
            margin-bottom: 22.15px;
        }

        /* Link-Styling & Rubrizierung */
        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease;
            cursor: pointer;
        }

        a:hover {
            color: var(--mennige);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jan Hunkemöller</h1>
        <p class="status">Website under construction.</p>
        <p><a href="mailto:jan@hunkemoeller.name">jan@hunkemoeller.name</a></p>
    </div>

</body>
</html>
