<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="index, follow">
    <title>Jan Hunkemöller</title>
    
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="index-page">

    <div class="page-container">
        <nav>
            <div class="nav-item nav-left">
                <a href="#" id="nav-title">Jan Hunkemöller</a>
            </div>
            <div class="nav-item nav-right">
                <a href="mailto:jan@hunkemoeller.name">contact</a>
            </div>
        </nav>

        <div id="quick-info" class="quick-info-box">
            <p>(born 1996) is a multidisciplinary artist.</p>
            <p>He studied at Kunstakademie Düsseldorf under John Morgan and Ed Atkins, and graduated as Meisterschüler of Ed Atkins.</p>
        </div>

        <main class="work-index">
            <div class="work-item slide-item active">
                <div class="media-scroll-wrapper">
                    <video id="sync-video" autoplay loop muted playsinline preload="auto" class="synced-loop">
                        <source src="images/attend.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </main>

        <div class="nav-bottom-right">
            <div class="nav-item">
                <a href="impressum.html">impressum</a>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('sync-video');

        if (video) {
            const applySync = () => {
                if (video.duration && !isNaN(video.duration)) {
                    const targetTime = (Date.now() / 1000) % video.duration;
                    if (Math.abs(video.currentTime - targetTime) > 0.3) {
                        video.currentTime = targetTime;
                    }
                }
            };

            const revealVideo = () => {
                applySync();
                video.play().catch(() => {});
                video.classList.add('is-ready');
            };

            video.addEventListener('loadeddata', revealVideo, { once: true });
            video.addEventListener('canplay', revealVideo, { once: true });

            setTimeout(revealVideo, 150);
        }

        const navTitle = document.getElementById('nav-title');
        const quickInfo = document.getElementById('quick-info');

        if (navTitle && quickInfo) {
            navTitle.addEventListener('click', (e) => {
                e.preventDefault();
                quickInfo.classList.toggle('is-visible');
            });
        }
    </script>

</body>
</html>
