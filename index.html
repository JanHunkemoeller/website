<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">
    <title>Jan Hunkemöller</title>
    
    <!-- Favicon -->
   <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <!-- Sorts Mill Goudy Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <!-- Navigation (Fixiert) -->
        <nav>
            <div class="nav-item nav-left">
                <span style="cursor: default;">Jan Hunkemöller</span>
            </div>
            <div class="nav-item nav-right">
                <a href="mailto:jan@hunkemoeller.name">contact</a>
            </div>
        </nav>

        <!-- Work-Index als isolierter Vollbild-Container -->
        <main class="work-index">
            <!-- Synchronisierter Video-Loop -->
            <div class="work-item slide-item active">
                <div class="media-scroll-wrapper">
                    <video id="sync-video" autoplay loop muted playsinline preload="metadata" class="synced-loop">
                        <source src="images/attend.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </main>
    </div>

    <script>
    const video = document.getElementById('sync-video');

    if (video) {
        const applySync = () => {
            if (video.duration && !isNaN(video.duration)) {
                const targetTime = (Date.now() / 1000) % video.duration;
                // Nur springen, wenn die Abweichung größer als 0.3 Sekunden ist
                if (Math.abs(video.currentTime - targetTime) > 0.3) {
                    video.currentTime = targetTime;
                }
            }
        };

        // 1. So früh wie möglich die Zeit setzen
        video.addEventListener('loadedmetadata', applySync, { once: true });

        // 2. Sobald das Video abgespielt werden kann, erneut abgleichen und einblenden
        video.addEventListener('canplay', () => {
            applySync();
            video.play().then(() => {
                video.classList.add('is-ready');
            }).catch(() => {
                video.classList.add('is-ready');
            });
        }, { once: true });
    }
</script>

</body>
</html>
