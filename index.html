<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="index, follow">
    <title>Jan Hunkemöller</title>
    <meta name="description" content="Jan Hunkemöller (born 1996) is a multidisciplinary artist. He graduated from Kunstakademie Düsseldorf as Meisterschüler of Ed Atkins.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jan Hunkemöller">
    <meta property="og:description" content="Multidisciplinary artist.">

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preload" href="fonts/sorts-mill-goudy-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">


    <noscript><style>.synced-loop { opacity: 1; }</style></noscript>
</head>
<body class="index-page">

    <div class="page-container">
        <nav>
            <div class="nav-item">
                <button type="button" id="nav-title" aria-expanded="false" aria-controls="quick-info">Jan Hunkemöller</button>
            </div>
            <div class="nav-item">
                <a href="mailto:jan@hunkemoeller.name">contact</a>
            </div>
        </nav>

        <div id="quick-info" class="quick-info-box">
            <p>(born 1996) is a multidisciplinary artist.</p>
            <p>He studied at Kunstakademie Düsseldorf under John Morgan and Ed Atkins, and graduated as Meisterschüler of Ed Atkins.</p>
        </div>

        <main class="work-index">
            <h1 class="visually-hidden">Jan Hunkemöller</h1>

            <div class="work-item slide-item">
                <div class="media-scroll-wrapper">
                    <video id="sync-video" class="synced-loop" autoplay loop muted playsinline preload="metadata"
                           aria-label="Attend, 2026, video loop">
                        <source src="images/attend.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </main>

        <div class="nav-bottom-right">
            <div class="nav-item">
                <a href="impressum.html" lang="de">impressum</a>
            </div>
        </div>
    </div>

    <script>

        const video = document.getElementById('sync-video');

        if (video) {
            const sync = () => {
                const d = video.duration;
                if (!Number.isFinite(d) || d <= 0) return;
                const target = (Date.now() / 1000) % d;
                if (Math.abs(video.currentTime - target) > 0.3) video.currentTime = target;
            };
            const reveal = () => video.classList.add('is-ready');

            if (video.readyState >= 1) sync();
            else video.addEventListener('loadedmetadata', sync, { once: true });

            video.addEventListener('playing', sync, { once: true });

            const start = () => {
                sync();
                const p = video.play();
                (p ? p.catch(() => {}) : Promise.resolve()).finally(reveal);
            };
            if (video.readyState >= 3) start();
            else video.addEventListener('canplay', start, { once: true });
        }

        const toggle = document.getElementById('nav-title');
        const info = document.getElementById('quick-info');

        if (toggle && info) {
            const setOpen = (open) => {
                info.classList.toggle('is-visible', open);
                toggle.setAttribute('aria-expanded', String(open));
            };

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                setOpen(!info.classList.contains('is-visible'));
            });

            document.addEventListener('click', (e) => {
                if (info.classList.contains('is-visible') && !info.contains(e.target) && e.target !== toggle) {
                    setOpen(false);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') setOpen(false);
            });
        }
    </script>

</body>
</html>
