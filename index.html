<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="color-scheme" content="light">
    <title>Jan Hunkemöller</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Sorts Mill Goudy Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <!-- Navigation (Fixiert) -->
        <nav>
            <div class="nav-item nav-left">
                <span style="cursor: default;">Jan Hunkemöller</span>
            </div>
            <div class="nav-item nav-right">
                <a href="mailto:jan@hunkemoeller.name">Contact</a>
            </div>
        </nav>

        <!-- Work-Index als isolierter Vollbild-Container -->
        <main class="work-index">
            <!-- Video-Loop (Attend) -->
            <div class="work-item slide-item active">
                <div class="media-scroll-wrapper">
                    <video autoplay loop muted playsinline preload="metadata">
                        <source src="images/attend.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
